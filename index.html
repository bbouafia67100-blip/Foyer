*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}

.av{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}

.center{text-align:center;padding:50px 24px}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sb_(promise, actionLabel = "opération") {
  const { data, error } = await promise;
  if (error) {
    console.error(`❌ Erreur ${actionLabel} :`, error);
    alert(`Erreur ${actionLabel} : ${error.message}`);
    throw error;
  }
  return data;
}

const COULEURS = ["#4f46e5","#ec4899","#0ea5e9","#f59e0b"];
const STATUTS = {idee:"💡 Idée",afaire:"📋 À faire",encours:"🔧 En cours",fait:"✅ Fait"};
const JOURS_COURTS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const $ = s => document.querySelector(s);
const esc = s => String(s??"").split("&").join("\u0026amp;").split("<").join("\u0026lt;").split(">").join("\u0026gt;").split('"').join("\u0026quot;").split("'").join("\u0026#39;");

let S = {foyer:null,moi:null,membres:[],corvees:[],projets:[],histo:[],tab:"today",modal:null,filtre:"tous",semDec:0,jourSel:null};
let dernierUndo = null;

const today = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};

const jours = d => Math.floor((new Date(today() + "T00:00:00") - new Date(d + "T00:00:00")) / 864e5);

function echeance(c){
  if(!c.derniere_fois) return -1;
  return c.frequence_jours - jours(c.derniere_fois);
}

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function lundiDe(d){
  const x = new Date(d);
  x.setHours(12, 0, 0, 0);
  const j = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - j);
  return x;
}

function joursSemaine(){
  const l = lundiDe(new Date());
  l.setDate(l.getDate() + S.semDec * 7);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(l);
    d.setDate(l.getDate() + i);
    return d;
  });
}

function occurrences(c, debutISO, finISO){
  const res = [];
  const t = today();
  
  if(!c.derniere_fois){ 
    if(t >= debutISO && t <= finISO) res.push(t);
    return res;
  }
  
  const dateBase = new Date(c.derniere_fois + "T00:00:00");
  let dateActuelle = new Date(dateBase);
  dateActuelle.setDate(dateActuelle.getDate() + c.frequence_jours);
  
  let garde = 0;
  while(iso(dateActuelle) <= finISO && garde++ < 400){
    const dateStr = iso(dateActuelle);
    if(dateStr < t){ 
      if(t >= debutISO && t <= finISO && !res.includes(t)) res.push(t);
    } else if(dateStr >= debutISO) {
      res.push(dateStr);
    }
    dateActuelle.setDate(dateActuelle.getDate() + c.frequence_jours);
  }
  
  return res;
}

function corveesDuJour(s){
  return S.corvees.filter(c => occurrences(c, s, s).includes(s));
}

const membre = id => S.membres.find(m => m.id === id);

function av(m){ 
  return m ? `<div class="av" style="background:${esc(m.couleur)}">${esc(m.nom[0].toUpperCase())}</div>` : `<div class="av" style="background:#ccc">?</div>`;
}

function aviconsMembres(liste) {
  if(!liste || liste.length === 0) return av(null);
  const avatars = liste.slice(0, 3).map(id => av(membre(id))).join("");
  return `<div class="avatars">${avatars}</div>`;
}

async function charger(){
  console.log("📥 Chargement des données...");

  if(!S.foyer || !S.moi) {
    console.warn("⚠️ Pas de foyer/moi");
    return;
  }

  const f = S.foyer.id;

  try {
    const [m, c, p, h] = await Promise.all([
      sb.from("membres").select("*").eq("foyer_id", f),
      sb.from("corvees").select("*").eq("foyer_id", f),
      sb.from("projets").select("*").eq("foyer_id", f),
      sb.from("historique").select("*").eq("foyer_id", f).order("fait_le", {ascending: false}).limit(500)
    ]);

    if(m.error || c.error || p.error || h.error) {
      const err = m.error || c.error || p.error || h.error;
      console.error("❌ Erreur chargement :", err);
      alert("Erreur chargement : " + err.message);
      return;
    }

    S.membres = m.data || [];
    S.corvees = c.data || [];
    S.projets = p.data || [];
    S.histo = h.data || [];

    console.log("✅ Données chargées :", S.corvees.length, "corvées");
    render();
  } catch(err) {
    console.error("❌ Erreur charger :", err);
    alert("Erreur chargement : " + err.message);
  }
}

function ecouter(){
  const f = "foyer_id=eq." + S.foyer.id;
  const ch = sb.channel("foyer-" + S.foyer.id);
  
  ["corvees", "projets", "historique", "membres"].forEach(t => {
    ch.on("postgres_changes", {event: "*", schema: "public", table: t, filter: f}, () => charger());
  });
  
  ch.subscribe();
  console.log("👂 Écoute activée");
}

let undoTimer = null;
function afficherUndo(titre){
  clearTimeout(undoTimer);
  const existant = document.getElementById("undo");
  if(existant) existant.remove();
  
  const d = document.createElement("div");
  d.id = "undo";
  d.style.cssText = "position:fixed;left:16px;right:16px;bottom:90px;background:#111827;color:#fff;padding:14px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)";
  d.innerHTML = `<span>✅ ${esc(titre)}</span><button onclick="annuler()" style="background:none;border:none;color:#a5b4fc;font-weight:700;font-size:16px;cursor:pointer">Annuler</button>`;
  document.body.appendChild(d);
  
  undoTimer = setTimeout(() => d.remove(), 6000);
}

async function annuler(){
  if(!dernierUndo) return;
  const u = dernierUndo;
  dernierUndo = null;
  document.getElementById("undo")?.remove();

  try {
    if(u.histoId) await sb_(sb.from("historique").delete().eq("id", u.histoId), "annulation historique");
    await sb_(sb.from("corvees").update({derniere_fois: u.ancienneDate, assigne_a_list: u.ancienAssigne}).eq("id", u.corveeId), "annulation corvée");
    await charger();
  } catch(err) {
    // déjà affiché par sb_()
  }
}

let enCours = new Set();

async function faire(id){
  if(enCours.has(id)) return; // empêche les clics multiples pendant le traitement
  enCours.add(id);

  console.log("👉 Marquer comme faite :", id);

  const c = S.corvees.find(x => x.id === id);
  if(!c) {
    console.error("❌ Corvée introuvable");
    enCours.delete(id);
    return;
  }

  const dateAuj = today();
  const assignesActuels = c.assigne_a_list && c.assigne_a_list.length > 0 ? c.assigne_a_list : (c.assigne_a ? [c.assigne_a] : []);

  try {
    const historiqueEntrees = assignesActuels.map(membre_id => ({
      foyer_id: S.foyer.id,
      corvee_id: c.id,
      membre_id: membre_id,
      titre: c.titre,
      points: c.points,
      fait_le: dateAuj,
      fait_par: S.moi.id
    }));

    const histoData = await sb_(sb.from("historique").insert(historiqueEntrees).select(), "ajout historique");
    const h = histoData && histoData[0];

    let suivants = assignesActuels;
    if(c.rotation && S.membres.length > 1) {
      suivants = assignesActuels.map(ancien_id => {
        const i = S.membres.findIndex(m => m.id === ancien_id);
        return S.membres[(i + 1) % S.membres.length].id;
      });
    }

    await sb_(sb.from("corvees").update({
      derniere_fois: dateAuj,
      assigne_a_list: suivants
    }).eq("id", id), "mise à jour corvée");

    dernierUndo = {
      corveeId: id,
      histoId: h ? h.id : null,
      ancienneDate: c.derniere_fois || null,
      ancienAssigne: c.assigne_a_list || [c.assigne_a]
    };

    if(navigator.vibrate) navigator.vibrate(30);
    await charger();
    afficherUndo(c.titre);

  } catch(err) {
    // déjà affiché par sb_()
  } finally {
    enCours.delete(id);
  }
}
  
const MODELES = [
  ["Passer l'aspirateur","RDC",7,2],["Passer l'aspirateur","Étage",7,2],
  ["Passer la serpillère","RDC",14,2],["Passer la serpillère","Étage",14,2],
  ["Nettoyer la salle de bain","RDC",7,3],["Nettoyer la salle de bain","Étage",7,3],
  ["Nettoyer les toilettes","RDC",7,2],["Nettoyer les toilettes","Étage",7,2],
  ["Changer les draps","Chambre RDC",14,2],["Changer les draps","Chambre étage",14,2],
  ["Ranger les habits","Chambres",7,1],
  ["Nettoyer les litières des chats","Litières",1,1],
  ["Sortir les poubelles","Cuisine",3,1],["Faire la vaisselle","Cuisine",1,1],
  ["Lessive","Buanderie",7,2],["Nettoyer le frigo","Cuisine",30,3],
  ["Dépoussiérer","Salon",14,1],["Nettoyer les vitres","Salon",30,3]
];

function formModeles(){
  const groupes = {};
  MODELES.forEach((m, i) => {
    (groupes[m[0]] = groupes[m[0]] || []).push(i);
  });
  
  ouvrir(`<h2>Corvées types</h2><p class="s">Cochez celles à ajouter, vous pourrez les modifier ensuite.</p>
  ${Object.entries(groupes).map(([titre, idx]) => 
    `<div class="t" style="margin-top:14px">${esc(titre)}</div>` +
    idx.map(i => 
      `<label style="display:flex;gap:10px;align-items:center;color:var(--txt);font-size:16px;font-weight:500;margin:6px 0">
        <input type="checkbox" class="mod" value="${i}" style="width:auto"> 
        ${esc(MODELES[i][1])}
      </label>`
    ).join("")
  ).join("")}
  <button class="btn" onclick="ajouterModeles()">Ajouter</button>`);
}

async function ajouterModeles(){
  const lignes = [...document.querySelectorAll(".mod:checked")].map(x => {
    const m = MODELES[+x.value];
    return {
      foyer_id: S.foyer.id,
      titre: m[0],
      piece: m[1],
      frequence_jours: m[2],
      points: m[3],
      rotation: true,
      assigne_a_list: [S.moi.id]
    };
  });

  if(!lignes.length) return fermer();

  try {
    await sb_(sb.from("corvees").insert(lignes), "ajout des modèles");
    console.log("✅ Modèles ajoutés");
    fermer();
    await charger();
  } catch(err) {
    // déjà affiché par sb_()
  }
}

async function sauverCorvee(id){
  const assignesCoches = [...document.querySelectorAll(".f-membre:checked")].map(x => x.value);
  const assignesFinal = assignesCoches.length > 0 ? assignesCoches : null;

  const o = {
    foyer_id: S.foyer.id,
    titre: document.getElementById("f-titre").value.trim(),
    piece: document.getElementById("f-piece").value.trim(),
    frequence_jours: +document.getElementById("f-freq").value,
    assigne_a_list: assignesFinal,
    rotation: document.getElementById("f-rot").checked,
    points: +document.getElementById("f-pts").value || 1
  };

  try {
    if(id) {
      await sb_(sb.from("corvees").update(o).eq("id", id), "modification corvée");
    } else {
      await sb_(sb.from("corvees").insert(o), "ajout corvée");
    }
    fermer();
    await charger();
  } catch(err) {
    // déjà affiché par sb_()
  }
}

function fermer(){
  S.modal = null;
  const modal = document.getElementById("modal");
  if(modal) modal.remove();
}

function ouvrir(html){
  fermer();
  S.modal = 1;
  const d = document.createElement("div");
  d.id = "modal";
  d.className = "modal";
  d.innerHTML = '<div class="sheet">' + html + '</div>';
  d.onclick = e => {
    if(e.target === d) fermer();
  };
  document.body.appendChild(d);
}

  ouvrir('<h2>' + (id ? "Modifier" : "Nouvelle") + ' corvée</h2>' +
    '<label>Titre</label><input id="f-titre" value="' + esc(c.titre||"") + '" placeholder="Passer l\'aspirateur">' +
    '<label>Pièce</label><input id="f-piece" value="' + esc(c.piece||"") + '" placeholder="Salon">' +
    '<label>Fréquence (jours)</label><input id="f-freq" type="number" value="' + (c.frequence_jours||7) + '" min="1">' +
    '<label>Points</label><input id="f-pts" type="number" value="' + (c.points||1) + '" min="1">' +
    '<label>Qui fait cette tâche ?</label>' +
    checkboxesMembres(c.assigne_a_list) +
    '<label style="display:flex;gap:10px;align-items:center;margin-top:16px"><input type="checkbox" id="f-rot" ' + (c.rotation ? "checked" : "") + ' style="width:auto"> Alterner automatiquement</label>' +
    '<button class="btn" onclick="sauverCorvee(\'' + (id||"") + '\')">Enregistrer</button>' +
    (id ? '<button class="btn del" onclick="supprimer(\'corvees\',\'' + id + '\')">Supprimer</button>' : ''));
}

function formProjet(id){
  const p = S.projets.find(x => x.id === id) || {statut:"idee", cout:0, notes:""};
  
  let statuts = '';
  for(let k in STATUTS) {
    statuts += '<option value="' + k + '" ' + (k === p.statut ? 'selected' : '') + '>' + STATUTS[k] + '</option>';
  }
  
  ouvrir('<h2>' + (id ? "Modifier" : "Nouveau") + ' projet</h2>' +
    '<label>Titre</label><input id="p-titre" value="' + esc(p.titre||"") + '" placeholder="Peindre la chambre">' +
    '<label>Statut</label><select id="p-statut">' + statuts + '</select>' +
    '<label>Budget estimé (€)</label><input id="p-cout" type="number" inputmode="decimal" value="' + (p.cout||"") + '">' +
    '<label>Responsable</label><select id="p-ass">' + optsMembres(p.assigne_a) + '</select>' +
    '<label>Notes</label><textarea id="p-notes" rows="3">' + esc(p.notes||"") + '</textarea>' +
    '<button class="btn" onclick="sauverProjet(\'' + (id||"") + '\')">Enregistrer</button>' +
    (id ? '<button class="btn del" onclick="supprimer(\'projets\',\'' + id + '\')">Supprimer</button>' : ''));
}

function carteCorvee(c, montrerBtn = true){
  const e = echeance(c);
  let pill, couleur;
  
  if(e < 0) {
    pill = `<span class="pill late">📍 En retard de ${-e}j</span>`;
    couleur = "#ef4444";
  } else if(e === 0) {
    pill = `<span class="pill soon">⚠️ Aujourd'hui</span>`;
    couleur = "#f59e0b";
  } else if(e === 1) {
    pill = `<span class="pill soon">🟡 Demain</span>`;
    couleur = "#fbbf24";
  } else if(e <= 3) {
    pill = `<span class="pill soon">📅 Dans ${e}j</span>`;
    couleur = "#60a5fa";
  } else {
    pill = `<span class="pill ok">✨ Dans ${e}j</span>`;
    couleur = "#10b981";
  }
  
  const avatars = aviconsMembres(c.assigne_a_list);
  
  return `<div class="card row" style="border-left:4px solid ${couleur}">
    ${montrerBtn ? `<button class="chk" onclick="faire('${c.id}')" aria-label="Fait"></button>` : ""}
    <div class="grow" onclick="formCorvee('${c.id}')">
      <div class="t">${esc(c.titre)}</div>
      <div class="s">${esc(c.piece || "—")} · ${pill}</div>
    </div>
    ${avatars}
  </div>`;
}

function vueToday(){
  const dues = S.corvees.filter(c => echeance(c) <= 0).sort((a,b) => echeance(a) - echeance(b));
  const miennes = dues.filter(c => (c.assigne_a_list || []).includes(S.moi.id) || c.assigne_a === S.moi.id);
  const autres = dues.filter(c => !(c.assigne_a_list || []).includes(S.moi.id) && c.assigne_a !== S.moi.id);
  const bientot = S.corvees.filter(c => echeance(c) > 0 && echeance(c) <= 3);
  const doneAuj = S.histo.filter(h => h.fait_le.slice(0,10) === today()).length;
  
  let h = `<div class="card row"><div class="grow"><div class="s">Fait aujourd'hui</div><div class="stat">${doneAuj}</div></div><div style="font-size:42px">${doneAuj > 0 ? "🎉" : "🧹"}</div></div>`;
  
  h += `<div class="sec">À faire par moi (${miennes.length})</div>` + (miennes.map(c => carteCorvee(c)).join("") || `<div class="card s">Rien pour vous, bravo ✨</div>`);
  
  if(autres.length) h += `<div class="sec">Pour l'autre (${autres.length})</div>` + autres.map(c => carteCorvee(c)).join("");
  if(bientot.length) h += `<div class="sec">Bientôt</div>` + bientot.map(c => carteCorvee(c, false)).join("");
  
  if(!S.corvees.length) h += `<div class="center s">Aucune corvée. Touchez + pour commencer.</div>`;
  
  return h;
}

function vueCorvees(){
  const pieces = [...new Set(S.corvees.map(c => c.piece || "Sans pièce"))].sort();
  return `<button class="btn sec2" style="margin:6px 0 12px" onclick="formModeles()">＋ Ajouter des corvées types</button>` + 
    (pieces.map(p => `<div class="sec">${esc(p)}</div>` + S.corvees.filter(c => (c.piece || "Sans pièce") === p).map(c => carteCorvee(c, false)).join("")).join("") || `<div class="center s">Aucune corvée.</div>`);
}

function vueSemaine(){
  const jours = joursSemaine();
  const debut = iso(jours[0]);
  const fin = iso(jours[6]);
  
  return `<div class="semnav">
    <button onclick="S.semDec--;render()" style="flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#e5e5ea">←</button>
    <div style="flex:1;text-align:center">
      <div class="t">${new Date(debut).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} - ${new Date(fin).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</div>
    </div>
    <button onclick="S.semDec++;render()" style="flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#e5e5ea">→</button>
  </div>
  <div class="bande">${jours.map((d, i) => {
    const s = iso(d);
    const corvees = corveesDuJour(s);
    const isToday = s === today();
    return `<button class="jour ${isToday ? "auj" : ""} ${S.jourSel === s ? "on" : ""}" onclick="S.jourSel='${s}';render()">
      <span class="jl">${JOURS_COURTS[i]}</span>
      <span class="jn">${d.getDate()}</span>
      <span class="jb"><i>${corvees.length}</i></span>
    </button>`;
  }).join("")}</div>
  ${S.jourSel ? `<div class="sec">${new Date(S.jourSel).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div>` + (corveesDuJour(S.jourSel).map(c => carteCorvee(c, true)).join("") || `<div class="card s">Aucune corvée ce jour</div>`) : ""}`;
}

function vueProjets(){
  const f = S.filtre;
  const chips = `<div class="chips"><button class="chip ${f === "tous" ? "on" : ""}" onclick="S.filtre='tous';render()">Tous</button>${Object.entries(STATUTS).map(([k,v]) => `<button class="chip ${f === k ? "on" : ""}" onclick="S.filtre='${k}';render()">${v}</button>`).join("")}</div>`;
  const liste = S.projets.filter(p => f === "tous" || p.statut === f);
  const total = liste.filter(p => p.statut !== "fait").reduce((s,p) => s + (+p.cout || 0), 0);
  
  return chips + `<div class="card row"><div class="grow"><div class="s">Budget restant</div><div class="stat">${total.toLocaleString("fr-FR")} €</div></div></div>` +
    (liste.map(p => `<div class="card"><div class="row"><div class="grow" onclick="formProjet('${p.id}')"><div class="t">${esc(p.titre)}</div>
    <div class="s">${STATUTS[p.statut]}${p.cout ? ` · ${(+p.cout).toLocaleString("fr-FR")} €` : ""}</div></div>${av(membre(p.assigne_a))}</div>
    ${p.statut !== "fait" ? `<button class="chip" style="margin-top:10px" onclick="changerStatut('${p.id}','${{idee:"afaire",afaire:"encours",encours:"fait"}[p.statut]}')">Passer à l'étape suivante →</button>` : ""}</div>`).join("") || `<div class="center s">Aucun projet.</div>`);
}

function vueBilan(){
  const debut = new Date();
  debut.setDate(debut.getDate() - 7);
  const sem = S.histo.filter(h => new Date(h.fait_le) >= debut);
  const pts = S.membres.map(m => ({m, p: sem.filter(h => h.membre_id === m.id).reduce((s,h) => s + h.points, 0)}));
  const tot = pts.reduce((s,x) => s + x.p, 0) || 1;

  return `<div class="sec">7 derniers jours</div><div class="card"><div class="bar">${pts.map(x => `<div style="width:${x.p/tot*100}%;background:${esc(x.m.couleur)}"></div>`).join("")}</div>
  ${pts.map(x => `<div class="row" style="margin-top:10px">${av(x.m)}<div class="grow t">${esc(x.m.nom)}</div><div class="t">${x.p} pts · ${Math.round(x.p/tot*100)} %</div></div>`).join("")}</div>
  <div class="sec">Activité récente</div>` +
  (S.histo.slice(0,15).map(h => `<div class="card row">${av(membre(h.membre_id))}<div class="grow"><div class="t">${esc(h.titre)}</div><div class="s">${new Date(h.fait_le).toLocaleString("fr-FR",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div></div><span class="pill">+${h.points}</span></div>`).join("") || `<div class="card s">Pas encore d'activité.</div>`) +
  `<div class="sec">Foyer</div>
  <div class="card"><div class="s">Code de ce foyer</div><div class="stat" style="letter-spacing:4px;margin-bottom:12px">${esc(S.foyer.code)}</div>
  <button class="btn" onclick="creerInvitation()">Générer un lien d'invitation</button>
  <button class="btn sec2" onclick="if(confirm('Quitter ce foyer sur cet appareil ?')){localStorage.removeItem('foyer');location.reload()}">Se déconnecter</button></div>`;
}
async function creerInvitation(){
  try {
    const token = await sb_(sb.rpc("creer_invitation", {
      p_foyer_id: S.foyer.id,
      p_created_by: S.moi.id,
      p_duree_jours: 7
    }), "création invitation");

    const lien = location.origin + location.pathname + "?invite=" + token;

    ouvrir(`<h2>Lien d'invitation</h2>
      <p class="s">Valable 7 jours, à usage unique.</p>
      <input id="lien-invit" readonly value="${esc(lien)}">
      <button class="btn" onclick="navigator.clipboard.writeText('${lien}');alert('Lien copié !')">Copier le lien</button>`);
  } catch(err) {
    // déjà affiché par sb_()
  }
}
function ecranInvitation(token){
  $("#app").innerHTML = `<div class="center"><div style="font-size:60px">💌</div>
  <h1>Invitation</h1><p class="s">Vous avez été invité à rejoindre un foyer sur Foyer.</p>
  <div class="card" style="text-align:left"><label>Votre prénom</label><input id="nom-invit" placeholder="Ex : Alex">
  <button class="btn" onclick="rejoindreInvitation('${token}')">Rejoindre le foyer</button></div></div>`;
}

async function rejoindreInvitation(token){
  const nom = document.getElementById("nom-invit").value.trim();
  if(!nom) return alert("Entrez votre prénom");

  try {
    const result = await sb_(sb.rpc("rejoindre_invitation", {p_token: token, p_nom: nom}), "utilisation de l'invitation");
    const r = result[0];

    localStorage.setItem("foyer", JSON.stringify({foyerId: r.foyer_id, moiId: r.membre_id}));
    history.replaceState(null, "", location.pathname);
    await demarrer();
  } catch(err) {
    // déjà affiché par sb_()
  }
}
const TITRES = {
  today: ["Aujourd'hui", () => new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})],
  corvees: ["Corvées", () => `${S.corvees.length} tâches récurrentes`],
  projets: ["Projets", () => "Améliorations de la maison"],
  bilan: ["Bilan", () => "Équité et activité"],
  semaine: ["Semaine", () => "Vue d'ensemble des 7 jours"]
};

function render(){
  if(!S.foyer) return;
  if(S.modal) return;
  
  const [t, sub] = TITRES[S.tab];
  const vues = {today: vueToday, semaine: vueSemaine, corvees: vueCorvees, projets: vueProjets, bilan: vueBilan};
  
  const main = $("main");
  const sc = main?.scrollTop || 0;
  
  $("#app").innerHTML = `<header><h1>${t}</h1><p>${sub()}</p></header><main>${vues[S.tab]()}</main>
    ${["corvees","projets","today","semaine"].includes(S.tab) ? `<button class="fab" onclick="${S.tab === "projets" ? "formProjet()" : "formCorvee()"}">+</button>` : ""}
    <nav>${[["today","☀️","Aujourd'hui"],["semaine","📅","Semaine"],["corvees","🧹","Corvées"],["projets","🔨","Projets"],["bilan","📊","Bilan"]].map(([k,i,l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';render()"><span>${i}</span>${l}</button>`).join("")}</nav>`;
  
  const newMain = $("main");
  if(newMain) newMain.scrollTop = sc;
}

/* ---------- Authentification ---------- */
function ecranAccueil(){
  $("#app").innerHTML = `<div class="center"><div style="font-size:60px">🏡</div>
  <h1>Foyer</h1><p class="s">Corvées et projets à deux, synchronisés.</p>
  <div class="card" style="text-align:left"><label>Votre prénom</label><input id="nom" placeholder="Ex : Alex">
  <label>Code du foyer (laissez vide pour en créer un)</label><input id="code" placeholder="Ex : K7M2QX" style="text-transform:uppercase">
  <button class="btn" onclick="rejoindre()">Continuer</button></div></div>`;
}

async function rejoindre(){
  const nom = document.getElementById("nom").value.trim();
  let code = document.getElementById("code").value.trim().toUpperCase();
  
  if(!nom) return alert("Entrez votre prénom");
  
  let foyer;
  try {
    if(code) {
      const {data} = await sb.from("foyers").select("*").eq("code", code).maybeSingle();
      if(!data) return alert("Code introuvable");
      foyer = data;
    } else {
      code = Math.random().toString(36).slice(2, 8).toUpperCase();
      const {data, error} = await sb.from("foyers").insert({code}).select().single();
      if(error) return alert("Erreur : " + error.message);
      foyer = data;
    }
    
    const {data: existants} = await sb.from("membres").select("*").eq("foyer_id", foyer.id);
    let me = (existants || []).find(m => m.nom.trim().toLowerCase() === nom.toLowerCase());
    
    if(!me) {
      const {data, error: e2} = await sb.from("membres").insert({
        foyer_id: foyer.id,
        nom: nom,
        couleur: COULEURS[(existants || []).length % COULEURS.length]
      }).select().single();
      
      if(e2) return alert("Erreur : " + e2.message);
      me = data;
    }
    
    localStorage.setItem("foyer", JSON.stringify({foyerId: foyer.id, moiId: me.id}));
    await demarrer();
  } catch(err) {
    console.error("❌ Erreur :", err);
    alert("Erreur : " + err.message);
  }
}

async function demarrer(){
  console.log("🚀 Démarrage...");
  const params = new URLSearchParams(location.search);
const token = params.get("invite");
if(token && !localStorage.getItem("foyer")){
  return ecranInvitation(token);
}
  const ls = JSON.parse(localStorage.getItem("foyer") || "null");
  if(!ls) return ecranAccueil();
  
  try {
    const {data: foyer} = await sb.from("foyers").select("*").eq("id", ls.foyerId).maybeSingle();
    const {data: moi} = await sb.from("membres").select("*").eq("id", ls.moiId).maybeSingle();
    
    if(!foyer || !moi){
      localStorage.removeItem("foyer");
      return ecranAccueil();
    }
    
    S.foyer = foyer;
    S.moi = moi;
    
    await charger();
    ecouter();
  } catch(err) {
    console.error("❌ Erreur démarrage :", err);
    alert("Erreur : " + err.message);
    ecranAccueil();
  }
}

// ===== LANCER =====
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

demarrer();
</script>
